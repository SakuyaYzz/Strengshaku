name: Strengshaku
version: 1.0
main: org.shaku.strengshaku.Strengshaku
api-version: 1.21
commands:
  ss:
    description: 打开各种强化菜单
    usage: /ss <玩家> <子命令>
    aliases: [strengshaku]
  ssadmin:
    description: 管理员指令，用于添加Lore
    usage: /ssadmin addlore <玩家> <段类型> <lore内容>
permissions:
  strengshaku.use:
    default: true
  strengshaku.admin:
    default: op
    description: 允许使用管理员命令